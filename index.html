<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Workout Log</title>
  <meta name="description" content="Offline-first workout and cardio logger that syncs to CSV on GitHub.">
  <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Workouts">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Workout Log</h1>
    <button id="syncBtn" class="pill" type="button">…</button>
    <button id="settingsBtn" class="icon-btn" type="button" aria-label="Settings">⚙︎</button>
  </header>

  <main>
    <!-- Home: start a workout or cardio, see history -->
    <section id="homeView" aria-label="Home">
      <div id="activeCard" class="active-card" hidden>
        <div>
          <small>In progress</small>
          <strong id="activeName"></strong>
          <span id="activeMeta" class="hint"></span>
        </div>
        <div class="btn-pair">
          <button id="resumeBtn" class="primary" type="button">Resume</button>
          <button id="activeFinishBtn" class="secondary" type="button">Finish</button>
          <button id="activeCancelBtn" class="secondary danger" type="button">Cancel</button>
        </div>
      </div>
      <button id="startBtn" class="primary start-btn" type="button">Start workout</button>
      <button id="cardioBtn" class="secondary start-btn" type="button">Log cardio</button>

      <h2 class="section-title">History</h2>
      <div id="history"></div>
    </section>

    <!-- Active workout: one card per exercise -->
    <section id="workoutView" aria-label="Workout" hidden>
      <div class="view-head">
        <button id="workoutBack" class="back-btn" type="button" aria-label="Home">‹</button>
        <button id="wName" class="view-title" type="button" aria-label="Rename workout"></button>
        <button id="finishBtn" class="finish-btn" type="button">Finish</button>
      </div>
      <p id="wMeta" class="hint view-meta"></p>
      <div id="exerciseList"></div>
      <button id="addExerciseBtn" class="secondary" type="button">+ Add exercise</button>
      <button id="cancelWorkoutBtn" class="link-btn danger cancel-workout" type="button">Cancel workout</button>
    </section>

    <!-- Cardio -->
    <section id="cardioView" aria-label="Cardio" hidden>
      <div class="view-head">
        <button id="cardioBack" class="back-btn" type="button" aria-label="Home">‹</button>
        <h2 class="view-title">Cardio</h2>
      </div>
      <div class="card">
        <div id="cardioSeg" class="segmented" role="group" aria-label="Cardio type">
          <button type="button" data-cardio="running">Running</button>
          <button type="button" data-cardio="stairmaster">Stairmaster</button>
          <button type="button" data-cardio="other">Other</button>
        </div>
        <div id="activityChips" class="chips" role="group" aria-label="Activity"></div>
        <p id="cardioHint" class="hint"></p>

        <div class="field">
          <label for="cDuration">Duration <span class="unit-hint">min, or 32.15 = 32:15</span></label>
          <div class="stepper">
            <button type="button" data-step="duration" data-dir="-1" aria-label="Shorter">−</button>
            <input id="cDuration" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="done">
            <button type="button" data-step="duration" data-dir="1" aria-label="Longer">+</button>
          </div>
        </div>

        <div id="distanceField" class="field">
          <label for="cDistance">Distance (km)</label>
          <div class="stepper">
            <button type="button" data-step="distance" data-dir="-1" aria-label="Shorter distance">−</button>
            <input id="cDistance" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="done">
            <button type="button" data-step="distance" data-dir="1" aria-label="Longer distance">+</button>
          </div>
        </div>

        <div id="floorsField" class="field">
          <label for="cFloors">Floors climbed</label>
          <div class="stepper">
            <button type="button" data-step="floors" data-dir="-1" aria-label="Fewer floors">−</button>
            <input id="cFloors" type="text" inputmode="numeric" autocomplete="off" enterkeyhint="done">
            <button type="button" data-step="floors" data-dir="1" aria-label="More floors">+</button>
          </div>
        </div>

        <div id="levelField" class="field">
          <label for="cLevel">Speed level</label>
          <div class="stepper">
            <button type="button" data-step="level" data-dir="-1" aria-label="Lower level">−</button>
            <input id="cLevel" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="done">
            <button type="button" data-step="level" data-dir="1" aria-label="Higher level">+</button>
          </div>
        </div>

        <details>
          <summary>Notes <span class="optional">optional</span></summary>
          <div class="more-body">
            <input id="cNotes" class="text-input" type="text" autocomplete="off" placeholder="e.g. intervals, treadmill" aria-label="Notes">
          </div>
        </details>

        <button id="cardioSaveBtn" class="primary" type="button">Log run</button>
      </div>
    </section>
  </main>

  <!-- The set logger moves into whichever exercise card is open; it waits here otherwise. -->
  <div id="loggerHome" hidden>
    <div id="setLogger" class="logger">
      <div id="variationChips" class="chips" role="group" aria-label="Variation"></div>
      <p id="lastSession" class="hint"></p>
      <div id="loggedSets" class="logged-sets"></div>
      <p id="loggedHint" class="hint small-hint">Tap a set to mark it as a warm-up or to failure.</p>

      <div class="field">
        <label for="weight">Weight (kg)</label>
        <div class="stepper">
          <button type="button" data-step="weight" data-dir="-1" aria-label="Less weight">−</button>
          <input id="weight" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="done">
          <button type="button" data-step="weight" data-dir="1" aria-label="More weight">+</button>
        </div>
      </div>

      <div class="field">
        <label for="reps">Reps</label>
        <div class="stepper">
          <button type="button" data-step="reps" data-dir="-1" aria-label="Fewer reps">−</button>
          <input id="reps" type="text" inputmode="numeric" autocomplete="off" enterkeyhint="done">
          <button type="button" data-step="reps" data-dir="1" aria-label="More reps">+</button>
        </div>
      </div>

      <div class="set-flags" role="group" aria-label="This set">
        <button id="flagWarmup" class="chip flag" type="button" aria-pressed="false">Warm-up</button>
        <button id="flagFailure" class="chip flag" type="button" aria-pressed="false">To failure</button>
      </div>

      <details id="more">
        <summary>RPE &amp; notes <span class="optional">optional</span></summary>
        <div class="more-body">
          <label class="text-label">RPE
            <input id="rpe" class="text-input" type="text" inputmode="decimal" autocomplete="off" placeholder="e.g. 8">
          </label>
          <label class="text-label">Notes
            <input id="notes" class="text-input" type="text" autocomplete="off" placeholder="e.g. paused reps, belt">
          </label>
        </div>
      </details>

      <button id="logSetBtn" class="primary" type="button">Log set 1</button>
      <div class="ex-actions">
        <button id="swapBtn" class="link-btn" type="button">Swap exercise</button>
        <button id="removeItemBtn" class="link-btn danger" type="button">Remove</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden>
    <span id="toastMsg"></span>
    <button id="toastAction" type="button" hidden></button>
  </div>

  <dialog id="templates" class="sheet">
    <div class="sheet-head">
      <h2>Start workout</h2>
      <button class="close" type="button" data-close autofocus>Cancel</button>
    </div>
    <div id="templateList" class="sheet-body"></div>
  </dialog>

  <dialog id="picker" class="sheet">
    <div class="sheet-head">
      <input id="pickerSearch" class="text-input" type="search" placeholder="Search or add…" autocomplete="off" autocapitalize="words" enterkeyhint="go">
      <button class="close" type="button" data-close autofocus>Cancel</button>
    </div>
    <div id="pickerList" class="sheet-body"></div>
  </dialog>

  <dialog id="settings" class="sheet">
    <div class="sheet-head">
      <h2>Settings</h2>
      <button class="close" type="button" data-close autofocus>Done</button>
    </div>
    <div class="sheet-body">
      <section class="settings-group">
        <h3>GitHub sync</h3>
        <label class="text-label">Owner
          <input id="sOwner" class="text-input" type="text" autocapitalize="off" autocorrect="off" spellcheck="false">
        </label>
        <label class="text-label">Data repo
          <input id="sRepo" class="text-input" type="text" autocapitalize="off" autocorrect="off" spellcheck="false">
        </label>
        <label class="text-label">Access token
          <input id="sToken" class="text-input" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="github_pat_…">
        </label>
        <button id="sTest" class="secondary" type="button">Save &amp; test connection</button>
        <p id="sTestMsg" class="hint"></p>
      </section>

      <section class="settings-group">
        <h3>Steppers</h3>
        <div class="two-col">
          <label class="text-label">Reps ±
            <input id="sRepStep" class="text-input" type="text" inputmode="numeric" autocomplete="off">
          </label>
          <label class="text-label">Weight ± (kg)
            <input id="sWeightStep" class="text-input" type="text" inputmode="decimal" autocomplete="off">
          </label>
        </div>
      </section>

      <section class="settings-group">
        <h3>Exercises</h3>
        <div class="add-row">
          <input id="sNewEx" class="text-input" type="text" placeholder="New exercise" autocomplete="off" autocapitalize="words" enterkeyhint="done">
          <button id="sAddEx" class="secondary" type="button">Add</button>
        </div>
        <p class="hint">Tap an exercise to edit its variations.</p>
        <div id="sExList"></div>
      </section>

      <section class="settings-group">
        <h3>Other cardio activities</h3>
        <div class="add-row">
          <input id="sNewAct" class="text-input" type="text" placeholder="New activity" autocomplete="off" autocapitalize="words" enterkeyhint="done">
          <button id="sAddAct" class="secondary" type="button">Add</button>
        </div>
        <ul id="sActList" class="ex-list"></ul>
      </section>

      <section class="settings-group">
        <h3>Data</h3>
        <p id="sStats" class="hint"></p>
        <button id="sExport" class="secondary" type="button">Export everything as CSV</button>
        <button id="sRestore" class="secondary" type="button">Restore history from GitHub</button>
        <p id="sDataMsg" class="hint"></p>
      </section>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
